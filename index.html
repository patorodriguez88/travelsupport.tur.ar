<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelSupport</title>
  <style>
    :root {
      --bg: #0e1a2b;
      --fg: #f5f7fa;
      --accent: #3ba9d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 32rem; }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
    p { font-size: 1.1rem; line-height: 1.6; opacity: .85; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Travel<span class="accent">Support</span></h1>
    <p>Sitio en construcción. Muy pronto vas a poder encontrar aquí toda la información sobre nuestros servicios.</p>
  </main>
</body>
</html>
